<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b2421">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Kaiser Brunch-scanner</title>
<style>
  :root {
    --beige: #ede5e0; --beige2: #e2d6cf; --dark: #2b2421; --dark2: #443a34;
    --green: #2e7d4f; --red: #b3402e; --amber: #b07c2e;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "Helvetica Neue", sans-serif;
    background: var(--dark); color: var(--beige);
    display: flex; flex-direction: column;
    height: 100dvh;
  }
  header {
    padding: calc(var(--sat) + 10px) 16px 10px;
    background: var(--dark); text-align: center; z-index: 5;
  }
  header h1 { margin: 0; font-size: 17px; letter-spacing: 2px; font-weight: 600; }
  header .sub { font-size: 12px; opacity: .65; margin-top: 2px; }
  main { flex: 1; position: relative; overflow: hidden; }

  /* ---- visninger ---- */
  .view { position: absolute; inset: 0; display: none; flex-direction: column; }
  .view.active { display: flex; }

  /* Scan */
  #videoWrap { position: relative; flex: 1; background: #000; overflow: hidden; }
  #video { width: 100%; height: 100%; object-fit: cover; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #status {
    position: absolute; left: 12px; right: 12px; bottom: 14px;
    background: rgba(43,36,33,.85); border-radius: 12px; padding: 10px 14px;
    font-size: 14px; text-align: center; backdrop-filter: blur(4px);
  }
  #status.good { background: rgba(46,125,79,.9); }
  #scanChip {
    position: absolute; top: 12px; right: 12px;
    background: rgba(43,36,33,.85); border-radius: 20px; padding: 7px 14px;
    font-size: 14px; font-weight: 700;
  }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #camFallback {
    position: absolute; inset: 0; display: none; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; padding: 30px; text-align: center;
    background: var(--dark2); font-size: 15px; line-height: 1.5;
  }

  /* Review-panel */
  #review {
    position: absolute; inset: 0; background: var(--beige); color: var(--dark);
    display: none; flex-direction: column; z-index: 20;
  }
  #review.open { display: flex; }
  #review .head { padding: 14px 16px 8px; font-weight: 700; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
  #review .hint { font-size: 12.5px; opacity: .6; padding: 0 16px 8px; }
  #reviewList { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
  .ritem {
    display: flex; align-items: center; gap: 12px; padding: 11px 12px; margin-bottom: 6px;
    background: #fff; border-radius: 12px; border: 2px solid transparent; font-size: 15px;
  }
  .ritem .box {
    width: 26px; height: 26px; border-radius: 7px; border: 2px solid #b9aca4;
    display: flex; align-items: center; justify-content: center; font-weight: 800; flex: none;
  }
  .ritem.on { border-color: var(--green); background: #e8f3ec; }
  .ritem.on .box { background: var(--green); border-color: var(--green); color: #fff; }
  .ritem .cat { margin-left: auto; font-size: 11px; opacity: .45; text-transform: uppercase; }
  .rcat { font-size: 11.5px; letter-spacing: 1.5px; text-transform: uppercase; opacity: .55; margin: 12px 6px 6px; font-weight: 700; }
  #review .btns { display: flex; gap: 10px; padding: 10px 12px calc(var(--sab) + 12px); background: var(--beige); }
  .bigbtn {
    flex: 1; padding: 16px; border: none; border-radius: 14px; font-size: 17px; font-weight: 700;
    font-family: inherit; cursor: pointer;
  }
  .bigbtn.ok { background: var(--green); color: #fff; }
  .bigbtn.no { background: #d8ccc5; color: var(--dark); flex: .55; }

  /* Total */
  #totalView { background: var(--beige); color: var(--dark); overflow-y: auto; padding: 14px 14px calc(var(--sab) + 80px); }
  .tophead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .tophead h2 { margin: 0; font-size: 19px; }
  .tophead .date { font-size: 13px; opacity: .6; }
  .statrow { display: flex; gap: 8px; margin: 10px 0 14px; }
  .stat { flex: 1; background: #fff; border-radius: 12px; padding: 10px; text-align: center; }
  .stat .n { font-size: 22px; font-weight: 800; }
  .stat .l { font-size: 11px; opacity: .55; margin-top: 2px; }
  .catblock { margin-bottom: 14px; }
  .catblock h3 { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; opacity: .55; margin: 0 4px 6px; }
  .trow {
    display: flex; align-items: center; background: #fff; border-radius: 10px;
    padding: 9px 12px; margin-bottom: 5px; font-size: 15px;
  }
  .trow .nm { flex: 1; }
  .trow .cnt { font-weight: 800; font-size: 17px; min-width: 34px; text-align: right; }
  .trow button {
    width: 32px; height: 32px; border-radius: 9px; border: none; background: var(--beige2);
    font-size: 18px; font-weight: 700; color: var(--dark); margin-left: 8px; cursor: pointer;
  }
  .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  .abtn {
    padding: 13px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600;
    font-family: inherit; background: var(--dark); color: var(--beige); cursor: pointer;
  }
  .abtn.warn { background: #f3e3df; color: var(--red); }

  /* Indstillinger */
  #setView { background: var(--beige); color: var(--dark); overflow-y: auto; padding: 14px 14px calc(var(--sab) + 80px); }
  #setView h2 { font-size: 19px; margin: 0 0 12px; }
  .setrow { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  .setrow label { font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px; }
  .setrow input[type=text] {
    width: 100%; padding: 9px 10px; border: 1.5px solid #d5c8c0; border-radius: 9px;
    font-size: 15px; font-family: inherit; background: var(--beige);
  }
  .setrow input[type=range] { width: 100%; }
  .setrow .small { font-size: 12px; opacity: .6; margin-top: 4px; }

  /* Bundnavigation */
  nav {
    display: flex; background: var(--dark); padding: 6px 8px calc(var(--sab) + 6px);
    gap: 6px; z-index: 10;
  }
  nav button {
    flex: 1; background: none; border: none; color: var(--beige); opacity: .5;
    font-size: 12px; font-family: inherit; padding: 8px 4px; border-radius: 10px; cursor: pointer;
  }
  nav button .ic { display: block; font-size: 21px; margin-bottom: 2px; }
  nav button.active { opacity: 1; background: var(--dark2); }

  /* Toast */
  #toast {
    position: fixed; left: 50%; bottom: calc(var(--sab) + 90px); transform: translateX(-50%) translateY(20px);
    background: var(--green); color: #fff; padding: 12px 22px; border-radius: 24px;
    font-size: 15px; font-weight: 700; opacity: 0; transition: all .25s; z-index: 50; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { background: var(--red); }
</style>
</head>
<body>
<header>
  <h1>CAFÉ KAISERS</h1>
  <div class="sub">Brunch-scanner · Byg-selv-brunch</div>
</header>

<main>
  <!-- SCAN -->
  <section class="view active" id="scanView">
    <div id="videoWrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="flash"></div>
      <div id="scanChip">0 sedler</div>
      <div id="status">Starter kamera …</div>
      <div id="camFallback">
        <div>Kameraet kunne ikke startes.<br>Du kan stadig tage et billede manuelt:</div>
        <button class="bigbtn ok" style="flex:none" onclick="document.getElementById('fileInput').click()">📷 Tag / vælg billede</button>
      </div>
    </div>
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">
  </section>

  <!-- TOTAL -->
  <section class="view" id="totalView"></section>

  <!-- INDSTILLINGER -->
  <section class="view" id="setView"></section>

  <!-- REVIEW -->
  <div id="review">
    <div class="head"><span id="reviewTitle">Aflæst seddel</span><span id="reviewMeta" style="font-size:12px;opacity:.5"></span></div>
    <div class="hint">Tjek aflæsningen – tryk på en ret for at rette. Godkend lægger sedlen til dagens total.</div>
    <div id="reviewList"></div>
    <div class="btns">
      <button class="bigbtn no" id="btnDiscard">Forkast</button>
      <button class="bigbtn ok" id="btnAccept">Godkend ✓</button>
    </div>
  </div>
</main>

<nav>
  <button id="navScan" class="active"><span class="ic">📷</span>Scan</button>
  <button id="navTotal"><span class="ic">🧮</span>Dagens total</button>
  <button id="navSet"><span class="ic">⚙️</span>Indstillinger</button>
</nav>

<div id="toast"></div>

<script src="vision.js"></script>
<script>
'use strict';
var KV = window.KaiserVision;

/* ================= state & lager ================= */
var LS_KEY = 'kaiser-brunch-scanner-v1';
var state = load();
function load() {
  try { var s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.days) return s; } catch (e) {}
  return { days: {}, settings: { sensitivity: 1, names: {}, location: '' } };
}
function save() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function todayKey() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function day() {
  var k = todayKey();
  if (!state.days[k]) state.days[k] = { log: [] };
  return state.days[k];
}
function itemName(id) {
  if (state.settings.names[id]) return state.settings.names[id];
  var b = KV.BOXES.find(function (x) { return x.id === id; });
  return b ? b.name : id;
}
function counts() {
  var c = {}, d = day();
  d.log.forEach(function (entry) {
    entry.items.forEach(function (id) { c[id] = (c[id] || 0) + 1; });
  });
  return c;
}

/* ================= toast & lyd ================= */
function toast(msg, err) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(t._tm);
  t._tm = setTimeout(function () { t.className = ''; }, 1800);
}
var audioCtx = null;
function beep(freq, dur) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq || 880; o.type = 'sine';
    g.gain.setValueAtTime(0.25, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.15));
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + (dur || 0.15));
  } catch (e) {}
}

/* ================= navigation ================= */
var views = { navScan: 'scanView', navTotal: 'totalView', navSet: 'setView' };
Object.keys(views).forEach(function (nid) {
  document.getElementById(nid).addEventListener('click', function () {
    Object.keys(views).forEach(function (n) {
      document.getElementById(n).classList.toggle('active', n === nid);
      document.getElementById(views[n]).classList.toggle('active', n === nid);
    });
    if (nid === 'navTotal') renderTotal();
    if (nid === 'navSet') renderSettings();
    scanningPaused = (nid !== 'navScan');
  });
});

/* ================= kamera & scanning ================= */
var video = document.getElementById('video');
var overlay = document.getElementById('overlay');
var statusEl = document.getElementById('status');
var chip = document.getElementById('scanChip');
var scanningPaused = false;
var busy = false;            // i gang med fuld aflæsning
var reviewOpen = false;
var lastQuad = null;
var stableCount = 0;
var mustClear = false;       // kortet skal ud af billedet før næste scanning
var clearFrames = 0;

var detCanvas = document.createElement('canvas');
var fullCanvas = document.createElement('canvas');

function setStatus(msg, good) {
  statusEl.textContent = msg;
  statusEl.className = good ? 'good' : '';
}
function updateChip() { chip.textContent = day().log.length + ' sedler'; }

async function startCamera() {
  try {
    var stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 3840 }, height: { ideal: 2160 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    setStatus('Hold en seddel foran kameraet');
    requestAnimationFrame(tick);
  } catch (e) {
    document.getElementById('camFallback').style.display = 'flex';
    setStatus('Intet kamera – brug foto-knappen');
  }
}

var lastDet = 0;
function tick() {
  requestAnimationFrame(tick);
  if (scanningPaused || busy || reviewOpen) return;
  if (!video.videoWidth) return;
  var now = performance.now();
  if (now - lastDet < 280) return;   // ~3,5 detektioner/sek
  lastDet = now;

  // lille detektions-frame
  var vw = video.videoWidth, vh = video.videoHeight;
  var dw = vw > vh ? 480 : 270;
  var dh = Math.round(dw * vh / vw);
  detCanvas.width = dw; detCanvas.height = dh;
  var ctx = detCanvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(video, 0, 0, dw, dh);
  var img = ctx.getImageData(0, 0, dw, dh);
  var gray = KV.grayscale(img.data, dw, dh);
  var quad = KV.findCardQuad(gray, dw, dh);

  drawOverlay(quad, dw, dh);

  if (mustClear) {
    if (!quad) { clearFrames++; if (clearFrames >= 2) { mustClear = false; setStatus('Klar til næste seddel'); } }
    else { clearFrames = 0; setStatus('Fjern sedlen – klar om et øjeblik'); }
    return;
  }

  if (!quad) { stableCount = 0; lastQuad = null; setStatus('Hold en seddel foran kameraet'); return; }

  // stabilitet: hjørnerne må højst flytte sig lidt mellem frames
  if (lastQuad && quadStable(quad, lastQuad, dw)) stableCount++;
  else stableCount = 0;
  lastQuad = quad;

  if (stableCount === 0) setStatus('Seddel fundet – hold den i ro …');
  if (stableCount >= 2) {
    stableCount = 0;
    captureAndRead();
  }
}

function quadStable(a, b, w) {
  var tol = w * 0.02;
  for (var i = 0; i < 4; i++) {
    if (Math.abs(a[i][0] - b[i][0]) > tol || Math.abs(a[i][1] - b[i][1]) > tol) return false;
  }
  return true;
}

function drawOverlay(quad, dw, dh) {
  var rect = video.getBoundingClientRect();
  overlay.width = rect.width; overlay.height = rect.height;
  var ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  if (!quad) return;
  // object-fit: cover → beregn skalering/beskæring
  var scale = Math.max(rect.width / dw, rect.height / dh);
  var ox = (rect.width - dw * scale) / 2, oy = (rect.height - dh * scale) / 2;
  ctx.strokeStyle = '#46c07a'; ctx.lineWidth = 3; ctx.beginPath();
  for (var i = 0; i < 4; i++) {
    var x = quad[i][0] * scale + ox, y = quad[i][1] * scale + oy;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.stroke();
}

function captureAndRead() {
  busy = true;
  setStatus('Læser sedlen …', true);
  document.getElementById('flash').style.opacity = '0.55';
  setTimeout(function () { document.getElementById('flash').style.opacity = '0'; }, 180);

  setTimeout(function () {   // lad UI'et opdatere først
    var vw = video.videoWidth, vh = video.videoHeight;
    // skaler ned til max 2200 px på den lange led – rigeligt til aflæsning
    var f = Math.min(1, 2200 / Math.max(vw, vh));
    var cw = Math.round(vw * f), ch = Math.round(vh * f);
    fullCanvas.width = cw; fullCanvas.height = ch;
    var ctx = fullCanvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(video, 0, 0, cw, ch);
    var img = ctx.getImageData(0, 0, cw, ch);
    processFrame(img.data, cw, ch);
  }, 30);
}

function processFrame(rgba, w, h) {
  var res;
  try { res = KV.readSheet(rgba, w, h, state.settings.sensitivity); }
  catch (e) { res = { ok: false, error: 'Uventet fejl: ' + e.message }; }
  busy = false;
  if (!res.ok) {
    beep(220, 0.25);
    setStatus('⚠️ ' + res.error + ' – prøv igen', false);
    mustClear = false;
    return;
  }
  beep(990, 0.12);
  openReview(res);
}

/* foto-fallback (filinput) */
document.getElementById('fileInput').addEventListener('change', function (ev) {
  var file = ev.target.files[0];
  if (!file) return;
  var url = URL.createObjectURL(file);
  var im = new Image();
  im.onload = function () {
    var f = Math.min(1, 2200 / Math.max(im.width, im.height));
    var cw = Math.round(im.width * f), ch = Math.round(im.height * f);
    fullCanvas.width = cw; fullCanvas.height = ch;
    var ctx = fullCanvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(im, 0, 0, cw, ch);
    var img = ctx.getImageData(0, 0, cw, ch);
    busy = true;
    processFrame(img.data, cw, ch);
    URL.revokeObjectURL(url);
    ev.target.value = '';
  };
  im.src = url;
});

/* ================= review ================= */
var currentItems = [];
function openReview(res) {
  reviewOpen = true;
  currentItems = res.items.map(function (it) {
    return { id: it.id, checked: it.checked, extra: it.extra, cat: it.cat };
  });
  document.getElementById('reviewMeta').textContent = res.bordersFound + '/21 felter fundet';
  renderReview();
  document.getElementById('review').classList.add('open');
}
function renderReview() {
  var list = document.getElementById('reviewList');
  list.innerHTML = '';
  var lastCat = null;
  var nChecked = currentItems.filter(function (i) { return i.checked && !i.extra; }).length;
  document.getElementById('reviewTitle').textContent = 'Aflæst: ' + nChecked + ' elementer';
  currentItems.forEach(function (it, idx) {
    if (it.cat !== lastCat) {
      lastCat = it.cat;
      var ch = document.createElement('div');
      ch.className = 'rcat'; ch.textContent = it.cat;
      list.appendChild(ch);
    }
    var row = document.createElement('div');
    row.className = 'ritem' + (it.checked ? ' on' : '');
    row.innerHTML = '<div class="box">' + (it.checked ? '✓' : '') + '</div><div>' + itemName(it.id) + '</div>';
    row.addEventListener('click', function () {
      currentItems[idx].checked = !currentItems[idx].checked;
      renderReview();
    });
    list.appendChild(row);
  });
}
document.getElementById('btnAccept').addEventListener('click', function () {
  var ids = currentItems.filter(function (i) { return i.checked; }).map(function (i) { return i.id; });
  if (ids.length === 0) { toast('Ingen krydser valgt', true); return; }
  day().log.push({ t: Date.now(), items: ids });
  save(); updateChip();
  closeReview();
  toast('Seddel #' + day().log.length + ' gemt ✓');
  mustClear = true; clearFrames = 0;
  setStatus('Gemt! Fjern sedlen og tag den næste');
});
document.getElementById('btnDiscard').addEventListener('click', function () {
  closeReview();
  mustClear = true; clearFrames = 0;
  setStatus('Forkastet – tag sedlen igen eller næste');
});
function closeReview() {
  document.getElementById('review').classList.remove('open');
  reviewOpen = false;
}

/* ================= dagens total ================= */
function renderTotal() {
  var v = document.getElementById('totalView');
  var d = day(), c = counts();
  var dist = { 5: 0, 6: 0, 7: 0, andet: 0 };
  d.log.forEach(function (e) {
    var n = e.items.filter(function (id) {
      var b = KV.BOXES.find(function (x) { return x.id === id; });
      return b && !b.extra;
    }).length;
    if (dist[n] !== undefined) dist[n]++; else dist.andet++;
  });
  var dateStr = new Date().toLocaleDateString('da-DK', { weekday: 'long', day: 'numeric', month: 'long' });

  var html = '<div class="tophead"><h2>Dagens total</h2><span class="date">' + dateStr + '</span></div>';
  html += '<div class="statrow">';
  html += '<div class="stat"><div class="n">' + d.log.length + '</div><div class="l">sedler</div></div>';
  html += '<div class="stat"><div class="n">' + dist[5] + ' / ' + dist[6] + ' / ' + dist[7] + '</div><div class="l">5 / 6 / 7 elementer</div></div>';
  html += '</div>';

  var cats = [];
  KV.BOXES.forEach(function (b) { if (cats.indexOf(b.cat) < 0) cats.push(b.cat); });
  cats.forEach(function (cat) {
    html += '<div class="catblock"><h3>' + cat + '</h3>';
    KV.BOXES.filter(function (b) { return b.cat === cat; }).forEach(function (b) {
      var n = c[b.id] || 0;
      html += '<div class="trow"><span class="nm">' + itemName(b.id) + '</span><span class="cnt">' + n + '</span>' +
        '<button data-adj="-1" data-id="' + b.id + '">−</button><button data-adj="1" data-id="' + b.id + '">+</button></div>';
    });
    html += '</div>';
  });

  html += '<div class="actions">';
  html += '<button class="abtn" id="btnManual">＋ Tilføj seddel manuelt</button>';
  html += '<button class="abtn" id="btnCopy">📋 Kopiér dagens tal</button>';
  html += '<button class="abtn" id="btnUndo">↩︎ Fortryd sidste seddel</button>';
  html += '<button class="abtn warn" id="btnReset">Nulstil dagen</button>';
  html += '</div>';
  v.innerHTML = html;

  v.querySelectorAll('button[data-adj]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      // manuel justering gemmes som en korrektions-post
      var id = btn.dataset.id, adj = parseInt(btn.dataset.adj, 10);
      if (adj > 0) day().log.push({ t: Date.now(), items: [id], korrektion: true });
      else {
        // fjern seneste forekomst af id
        var lg = day().log;
        for (var i = lg.length - 1; i >= 0; i--) {
          var ix = lg[i].items.indexOf(id);
          if (ix >= 0) {
            lg[i].items.splice(ix, 1);
            if (lg[i].items.length === 0) lg.splice(i, 1);
            break;
          }
        }
      }
      save(); updateChip(); renderTotal();
    });
  });
  document.getElementById('btnManual').addEventListener('click', function () {
    openReview({ items: KV.BOXES.map(function (b) { return { id: b.id, checked: false, extra: !!b.extra, cat: b.cat }; }), bordersFound: 0 });
    document.getElementById('reviewMeta').textContent = 'manuel indtastning';
  });
  document.getElementById('btnCopy').addEventListener('click', function () {
    var lines = ['Café Kaisers – brunch ' + todayKey() + (state.settings.location ? ' (' + state.settings.location + ')' : ''),
                 'Sedler: ' + d.log.length,
                 '5/6/7 elementer: ' + dist[5] + '/' + dist[6] + '/' + dist[7], ''];
    KV.BOXES.forEach(function (b) { lines.push(itemName(b.id) + ': ' + (c[b.id] || 0)); });
    var txt = lines.join('\n');
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { toast('Kopieret ✓'); });
    else toast('Kopiering ikke understøttet', true);
  });
  document.getElementById('btnUndo').addEventListener('click', function () {
    if (day().log.length === 0) { toast('Ingen sedler i dag', true); return; }
    day().log.pop(); save(); updateChip(); renderTotal(); toast('Sidste seddel fjernet');
  });
  document.getElementById('btnReset').addEventListener('click', function () {
    if (confirm('Nulstil hele dagens optælling?')) {
      state.days[todayKey()] = { log: [] };
      save(); updateChip(); renderTotal(); toast('Dagen er nulstillet');
    }
  });
}

/* ================= indstillinger ================= */
function renderSettings() {
  var v = document.getElementById('setView');
  var html = '<h2>Indstillinger</h2>';
  html += '<div class="setrow"><label>Lokation</label><input type="text" id="setLoc" value="' + (state.settings.location || '') + '" placeholder="fx Kongedybet"></div>';
  html += '<div class="setrow"><label>Følsomhed: <span id="sensVal">' + state.settings.sensitivity.toFixed(1) + '</span></label>' +
    '<input type="range" id="setSens" min="0.5" max="2" step="0.1" value="' + state.settings.sensitivity + '">' +
    '<div class="small">Højere = opfanger svagere krydser (risiko for falske). Standard 1,0.</div></div>';
  html += '<div class="setrow"><label>Retternes navne (ved menuskift)</label><div class="small" style="margin-bottom:8px">Navnene bruges i totaler og eksport. Krydsernes <b>placering</b> på kortet skal forblive den samme – ellers skal appen opdateres.</div>';
  KV.BOXES.forEach(function (b) {
    html += '<input type="text" data-name="' + b.id + '" value="' + itemName(b.id).replace(/"/g, '&quot;') + '" style="margin-bottom:6px">';
  });
  html += '</div>';
  html += '<div class="setrow"><div class="small">Kaiser Brunch-scanner v1.0 · Data gemmes kun på denne telefon.</div></div>';
  v.innerHTML = html;

  document.getElementById('setLoc').addEventListener('change', function (e) {
    state.settings.location = e.target.value; save();
  });
  document.getElementById('setSens').addEventListener('input', function (e) {
    state.settings.sensitivity = parseFloat(e.target.value);
    document.getElementById('sensVal').textContent = state.settings.sensitivity.toFixed(1);
    save();
  });
  v.querySelectorAll('input[data-name]').forEach(function (inp) {
    inp.addEventListener('change', function () {
      state.settings.names[inp.dataset.name] = inp.value; save();
    });
  });
}

/* ================= init ================= */
updateChip();
startCamera();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
